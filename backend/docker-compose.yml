services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dydat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dydat_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dydat}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dydat}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      # Porta host 18000 -> porta container 8000.
      # 8000/8001 erano occupate da altri software sul sistema di Villa (es. Whisper for Windows).
      - "18000:8000"
    env_file:
      - .env
    volumes:
      - .:/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
